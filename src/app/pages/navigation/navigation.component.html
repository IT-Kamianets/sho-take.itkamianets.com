<main class="mx-auto max-w-[var(--container)] px-3 pb-8 pt-3 sm:px-4 sm:pb-10">
	<section
		class="overflow-hidden rounded-[1.2rem] border border-[var(--c-border)] bg-[var(--c-bg-secondary)] shadow-[var(--shadow-sm)]"
	>
		<div
			class="border-b border-[var(--c-border)] bg-[linear-gradient(135deg,rgba(197,61,61,0.14),rgba(217,168,88,0.08))] px-4 py-5 sm:px-5"
		>
			<p
				class="text-[12px] font-semibold uppercase tracking-[0.18em] text-[var(--c-secondary)]"
				translate
			>
				Navigation
			</p>
		</div>

		<div class="p-4 sm:p-5">
			<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
				@for (item of navItems; track item.route) {
					<a
						class="group relative flex flex-col justify-between overflow-hidden rounded-[1.25rem] border border-[var(--c-border)] bg-[var(--c-bg-primary)] p-5 transition-all duration-300 hover:-translate-y-1 hover:shadow-[var(--shadow-md)]"
						[routerLink]="item.route"
					>
						<div
							class="absolute -right-6 -top-6 h-24 w-24 rounded-full bg-[var(--c-secondary)]/5 transition-transform duration-500 group-hover:scale-150"
						></div>
						
						<div>
							<div class="flex items-center justify-between">
								<span
									class="flex h-12 w-12 items-center justify-center rounded-[1rem] bg-[var(--c-secondary)]/10 text-[var(--c-secondary)]"
								>
									<span class="material-symbols-outlined text-[26px]" aria-hidden="true">{{ item.icon }}</span>
								</span>
								<p class="text-[14px] font-bold tracking-[0.1em] text-[var(--c-text-muted)] opacity-50 group-hover:text-[var(--c-secondary)] group-hover:opacity-100 transition-all duration-300">
									{{ item.badge }}
								</p>
							</div>

							<div class="mt-5 relative z-10">
								<h2 class="text-xl font-semibold text-[var(--c-text-secondary)]" translate>
									{{ item.label }}
								</h2>
								<p class="mt-2 text-[13px] leading-relaxed text-[var(--c-text-muted)]" translate>
									{{ item.description }}
								</p>
							</div>
						</div>
					</a>
				}
			</div>
		</div>
	</section>
</main>
